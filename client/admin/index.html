<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PriceRadar Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236d5cff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <section id="login-view" class="center-page hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <a class="brand" href="/"><span class="logo">◎</span><span>PriceRadar Admin</span></a>
      <div>
        <h1>Sign in</h1>
        <p class="muted small" style="margin-top:4px">Use the admin username and password from your .env file.</p>
      </div>
      <label class="field">Username <input name="username" autocomplete="username" required></label>
      <label class="field">Password <input name="password" type="password" autocomplete="current-password" required></label>
      <div class="form-error" id="login-error" role="alert"></div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app-view" class="admin-shell hidden">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="logo">◎</span><span class="word">PriceRadar</span></a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard">📊 <span>Dashboard</span></a>
        <a href="#/schedules" data-route="schedules">⏱️ <span>Schedules</span></a>
        <a href="#/sources" data-route="sources">🏬 <span>Stores</span></a>
        <a href="#/categories" data-route="categories">🏷️ <span>Categories</span></a>
        <a href="#/products" data-route="products">📦 <span>Products</span></a>
        <a href="#/runs" data-route="runs">🧾 <span>Run history</span></a>
      </nav>
      <div class="foot">
        <div class="small muted" id="scheduler-status">Checking scheduler…</div>
        <button class="btn ghost small-btn" id="themeToggle" type="button"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> Theme</button>
        <a class="btn ghost small-btn" href="/">View shop</a>
        <button class="btn ghost small-btn" id="logout" type="button">Sign out</button>
      </div>
    </aside>
    <main class="admin-main" id="view" aria-live="polite"></main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div class="toast-wrap" id="toasts"></div>
  <script type="module" src="/src/pages/admin.js"></script>
</body>
</html>
