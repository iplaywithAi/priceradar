<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | PriceRadar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236d5cff'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="brand" href="/"><span class="logo">◎</span><span>PriceRadar</span></a>
      <nav>
        <button class="btn ghost small-btn" id="themeToggle" type="button" aria-label="Toggle light or dark theme"><svg class="icon-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg> Theme</button>
        <a class="btn ghost small-btn" href="/">All products</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-bottom: 60px">
    <div class="crumbs" id="crumbs"></div>
    <div id="content">
      <div class="product">
        <div class="skeleton" style="aspect-ratio:1/1;border-radius:16px"></div>
        <div style="display:grid;gap:14px"><div class="skeleton" style="height:30px;border-radius:8px"></div><div class="skeleton" style="height:120px;border-radius:12px"></div></div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/pages/product.js"></script>
</body>
</html>
